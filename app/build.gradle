plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lionplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lionplayer.app"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "2.0.0-vault"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        // Tink (used by androidx.security:security-crypto) ships proto metadata we don't need in the APK
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/*.version']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // ===== Secure Vault dependencies =====
    // Biometric (fingerprint) authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    // EncryptedFile / EncryptedSharedPreferences (AES-256-GCM backed by Android Keystore + Tink)
    implementation 'androidx.security:security-crypto:1.1.0'
    // Tink (used by security-crypto) needs Gson at runtime for keyset handling
    implementation 'com.google.code.gson:gson:2.10.1'

    // Architecture Components & Coroutines
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil High-Performance Image & Video Thumbnail Loading
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'io.coil-kt:coil-video:2.6.0'

    // Media3
    def media3_version = "1.3.0"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-decoder:$media3_version"
}
